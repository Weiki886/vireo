spring:
  application:
    name: vireo-backend
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/vireo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    # 优先读环境变量 DB_PASSWORD，未设置时用本地开发默认值；生产凭据不得写入此文件
    password: ${DB_PASSWORD:123456}
server:
  port: 8123
  servlet:
    context-path: /api

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.weiki.vireobackend.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
