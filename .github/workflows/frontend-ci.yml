# 前端 CI：仅当 vireo-frontend/** 或本文件变化时触发
name: frontend-ci

on:
  push:
    branches: [main]
    paths:
      - 'vireo-frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'vireo-frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vireo-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vireo-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes type check)
        run: npm run build
