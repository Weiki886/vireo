# 后端 CI：仅当 vireo-backend/** 或本文件变化时触发
name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'vireo-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'vireo-backend/**'
      - '.github/workflows/backend-ci.yml'

# 同一分支新推送时取消旧的运行，节省 CI 资源
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: vireo-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify
