# 后端 CI：仅当 vireo-backend/** 或本文件变化时触发
name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'vireo-backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'vireo-backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vireo-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B -ntp verify
